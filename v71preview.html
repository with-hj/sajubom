<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v71 preview</title>
<style>
  html,body{margin:0;padding:0;background:#0b1120}
  #pv{display:block;width:390px;height:844px;border:0;margin:0}
</style>
</head>
<body>
<iframe id="pv" src="./?gate=0&v=71" title="preview"></iframe>
<script>
(function(){
  var f=document.getElementById('pv');
  var mode=(location.hash||'').replace('#','');
  function scrollBottom(){
    try{
      var w=f.contentWindow, d=f.contentDocument;
      if(!w||!d) return;
      w.scrollTo(0, (d.body&&d.body.scrollHeight)||99999);
    }catch(e){}
  }
  function start(){
    setTimeout(function(){
      if(mode==='footer'){ scrollBottom(); setTimeout(scrollBottom,600); setTimeout(scrollBottom,1500); return; }
      var d=f.contentDocument; if(!d) return;
      var m=d.getElementById('menuBtn'); if(m) m.click();
      setTimeout(function(){
        var c=d.querySelector('.dr-link[data-dr="contact"]');
        if(c) c.click();
      },800);
    },900);
  }
  if(f.contentDocument && f.contentDocument.readyState==='complete') start();
  else f.addEventListener('load', start);
})();
</script>
</body>
</html>
