<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile frame preview</title>
<style>
  html,body{margin:0;padding:0;background:#20242b}
  #ph{position:absolute;left:0;top:0;width:390px;height:844px;border:0;background:#000}
</style>
</head>
<body>
<iframe id="ph" src="./index.html?v=14"></iframe>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var f=document.getElementById('ph');
  var w=+(q.get('w')||390), h=+(q.get('h')||844), y=+(q.get('y')||0);
  f.style.width=w+'px'; f.style.height=h+'px';
  f.addEventListener('load',function(){
    try{
      var d=f.contentDocument, win=f.contentWindow;
      var tab=q.get('tab'); if(tab){ var b=d.querySelector('[data-track="'+tab+'"]'); if(b) b.click(); }
      var theme=q.get('theme'); if(theme){ var c=d.querySelector('[data-theme="'+theme+'"]'); if(c) c.click(); }
      var sub=q.get('sub'); if(sub){ var s=d.querySelector('[data-tab="'+sub+'"]'); if(s) s.click(); }
      if(y) setTimeout(function(){ win.scrollTo(0,y); },500);
    }catch(e){}
  });
})();
</script>
</body>
</html>
